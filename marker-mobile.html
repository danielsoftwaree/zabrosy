function openPosition(){showSheet('Берег и ориентир','<p>Сначала твоё место, затем заметный объект напротив. По этим двум точкам привяжем новые лучи к реальной карте.</p><div class="stack">'+btn('gpsHere',icon('location')+' Найти меня по GPS')+btn('manualMap',icon('map')+' Поставить на снимке','secondary')+'</div><p>GPS может ошибаться на несколько метров и больше. Перед подтверждением подвинь метку на свой берег.</p><details><summary class="subtle-action">Ввести координаты вручную</summary><div class="row">'+field('bankLat','Широта',state.settings.bank?.lat??'',{placeholder:'53,38…'})+field('bankLng','Долгота',state.settings.bank?.lng??'',{placeholder:'14,61…'})+'</div>'+field('manualBearing','Азимут ориентира, °','',{placeholder:'0 = север, 90 = восток'})+btn('useCoords','Привязать по координатам','secondary')+'</details><p class="small">Без GPS снимок открывается в районе Цыгылинки, а не на твоём фактическом месте. Данные забросов остаются на устройстве; запросы снимков передают район просмотра Geoportal.</p>',()=>{on('bindEarlier',()=>confirmSheet('Привязать ранние промеры?','Подтверди, что ВСЕ записи без координат сделаны с этого же берега и с тем же нулевым ориентиром. Это действие задаст их примерные места на снимке.','Да, берег и ориентир те же',()=>{for(const c of state.casts){if(!c.origin){c.origin=C.clone(state.settings.bank);c.bearing=C.norm(state.settings.bearing+c.angle);c.referenceBearing=state.settings.bearing;}}save();closeSheet();map.request();updateTop();toast('Ранние записи привязаны по твоему подтверждению.');}));on('gpsHere',locateGPS);on('manualMap',()=>{closeSheet();beginPlacement();});on('useCoords',()=>{const lat=num('bankLat'),lng=num('bankLng'),bearing=num('manualBearing');if(lat===null||lng===null||!C.geo({lat,lng})||bearing===null||!Number.isFinite(bearing)||bearing<0||bearing>=360)return errorSheet('Нужны широта, долгота и азимут от 0 до 359,9°.');state.settings.bank={lat,lng,accuracy:null};state.settings.bearing=bearing;state.settings function confirmPlacement(){const a=map.geom().anchor,p=map.screenToGeo(a.x,a.y);if(ui.placeMode==='bank'){ui.pendingBank={...p,accuracy:ui.pendingGPS?.accuracy??null};ui.placeMode='reference';map.centerAt(C.destination(p,state.settings.geoAligned?state.settings.bearing:0,40),19);renderDock();map.request();return;}const bank=ui.pendingBank;if(!bank||C.meters(bank,p)<5){toast('Выбери ориентир хотя бы в пяти метрах от своего места.');return;}state.settings.bank=bank;state.settings.reference=p;state.settings.bearing=C.bearing(bank,p);state.settings.geoAligned=true;ui.placeMode=null;ui.pendingBank=null;ui.followHeading=false;state.aim.angle=0;save();renderDock();updateTop();map.centerAt(C.destination(bank,state.settings.bearing,28),19);toast('Берег и нулевой ориентир заданы. Новые забросы появятся на снимке.',null,null,5500);}
function openCompass(){const c=ui.compass;showSheet('Наведи телефоном','<p>Держи телефон в портретной ориентации, экраном почти горизонтально. Его верхний край направь на свой ориентир.</p><div class="readout"><span id="sensorState">'+(c.enabled?'Ждём устойчивое направление':'Датчик выключен')+'</span><strong id="sensorValue">—</strong></div><div class="stack">'+btn('enableSensor',icon('compass')+' Включить датчик')+btn('zeroSensor','Это ориентир · принять за 0°','secondary')+btn('disableSensor','Выключить и выбирать пальцем','secondary')+'</div><p>Гироскоп сам по себе не знает север. Здесь обнуляем направление по видимому ориентиру; по нему считаем относительный угол. Перед забросом угол фиксируется.</p><p class="small">Доступ зависит от браузера, разрешений и HTTPS. Держи телефон подальше от металла. При отсутствии датчика ввод пальцем остаётся доступен.</p>',()=>{on('enableSensor',enableSensors);on('zeroSensor',()=>{if(!Number.isFinite(ui.compass.heading)||!ui.compass.flat)return errorSheet('Нет подходящего показания. Держи экран почти горизонтально в портретной ориентации.');ui.compass.zero=ui.compass.heading;ui.followHeading=true;state.aim.angle=0;closeSheet();updateAim();save();$('compassBtn').classList.add('active');toast('0° задан. Поверни телефон в сторону заброса, затем начни промер.');});on('disableSensor',()=>{disableSensors();closeSheet();updateAim();});updateCompassSheet();});}
async function enableSensors(){try{if(!window.isSecureContext)throw Error('Для датчика нужен HTTPS или localhost. Сейчас выбирай направление на секторе.');if(!window.DeviceOrientationEvent)throw Error('Датчик ориентации недоступен. Можно задать угол вручную.');if(typeof DeviceOrientationEvent.requestPermission==='function'){const answer=await DeviceOrientationEvent.requestPermission(true);if(answer!=='granted')throw Error('Доступ к датчику не разрешён.');}window.removeEventListener('deviceorientation',orientation);window.removeEventListener('deviceorientationabsolute',orientation);window.addEventListener('deviceorientation',orientation);window.addEventListener('deviceorientationabsolute',orientation);ui.compass.enabled=true;sensorNotice=false;updateCompassSheet();clearTimeout(sensorTimeout);sensorTimeout=setTimeout(()=>{if(!Number.isFinite(ui.compass.heading))toast('Датчик не прислал направление. Используй сектор или введи угол.',null,null,5500);},6000);}catch(e){errorSheet(e.message||'Не удалось включить датчик.');}}
function orientation(e){const c=ui.compass;let heading,source;if(Number.isFinite(e.webkitCompassHeading)&&!(Number.isFinite(e.webkitCompassAccuracy)&&e.webkitCompassAccuracy<0)){heading=e.webkitCompassHeading;source='компас';}else if(Number.isFinite(e.alpha)){heading=C.norm(360-e.alpha);source=e.absolute?'абсолютная ориентация':'относительная ориентация';}else return;if(c.source==='компас'&&source!=='компас')return;if(c.source==='абсолютная ориентация'&&source==='относительная ориентация')return;const angle=screen.orientation?.angle??window.orientation??0;c.flat=Math.abs(e.beta??0)<=35&&Math.abs(e.gamma??0)<=35&&(angle===0||angle===180);if(angle===180)heading=C.norm(heading+180);c.heading=c.heading===null?heading:C.norm(c.heading+C.delta(heading,c.heading)*.2);c.source=source;c.last=performance.now();$('compassIcon').style.transform='rotate('+ (c.zero===null?c.heading:C.delta(c.heading,c.zero))+'deg)';updateCompassSheet();if(ui.followHeading&&c.zero!==null&&ui.phase==='ready'&&c.flat){const d=C.delta(c.heading,c.zero);if(Math.abs(d)>85){ui.followHeading=false;$('compassBtn').classList.remove('active');toast('Направление вышло за сектор. Выбери его пальцем или снова задай ориентир.');return;}state.aim.angle=Math.round(d*10)/10;updateAim();scheduleSave();}}
function updateCompassSheet(){if(!$('sensorState'))return;const c=ui.compass;$('sensorState').textContent=!c.enabled?'Датчик выключен':!c.flat?'Положи экран почти горизонтально':c.heading===null?'Ждём показания…':c.zero===null?'Готов к обнулению':'Угол от ориентира';$('sensorValue').textContent=c.heading===null?'—':c.zero===null?'Готов':fmt(C.delta(c.heading,c.zero))+'°';$('zeroSensor').disabled=c.heading===null||!c.flat;$('enableSensor').hidden=c.enabled;}
function disableSensors(){window.removeEventListener('deviceorientation',orientation);window.removeEventListener('deviceorientationabsolute',orientation);clearTimeout(sensorTimeout);ui.compass.enabled=false;ui.followHeading=false;$('compassBtn').classList.remove('active');}
async function acquireWake(){if(!state.settings.wake||!state.draft||!navigator.wakeLock||document.visibilityState!=='visible')return;try{if(ui.wake&&!ui.wake.released)return;const lock=await navigator.wakeLock.request('screen');ui.wake=lock;lock.addEventListener('release',()=>{if(ui.wake===lock)ui.wake=null;updateWakeLabel();});updateWakeLabel();}catch(e){ui.wake=null;updateWakeLabel();}}
async function releaseWake(){try{await ui.wake?.release();}catch(e){}ui.wake=null;updateWakeLabel();}
function updateWakeLabel(){const el=$('wakeStatus');if(el)el.textContent=ui.wake?'Экран не гаснет':'Не блокируй экран';}
function openPage(name){ui.page=name;$('page').hidden=false;renderPage(name);try{history.replaceState(null,'','#'+name);}catch(e){}$('page').scrollTop=0;}
function closePage(){ui.page=null;$('page').hidden=true;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}map?.request();}
function menuRow(action,ico,title,sub){return '<button class="menu-row" data-menu="'+action+'"><span class="menu-icon">'+icon(ico)+'</span><span class="row-label"><strong>'+title+'</strong><span class="small">'+sub+'</span></span>'+icon('next')+'</button>';}
function renderPage(name){if(name==='journal'){renderJournal();return;}if(name==='guide'){renderGuide();return;}if(name==='data'){renderData();return;}$('pageTitle').textContent='Твой Маркер';$('pageContent').innerHTML='<div class="eyebrow">НАСТРОЙ ОДИН РАЗ · ЛОВИ БЕЗ ЛИШНЕГО</div>'+menuRow('reel','reel','Катушка и метры',fmt(state.settings.pickup*100,1)+' см за оборот · '+(state.settings.calibrated?'измерено':'примерное значение'))+menuRow('position','pin','Берег и ориентир',state.settings.geoAligned?'Геопривязка задана':'Привязать сектор к снимку')+menuRow('compass','compass','Компас телефона',ui.compass.enabled?'Датчик включён':'Не обязателен для промера')+menuRow('guide','help','Как промерять', 'От первого заброса до площадки у свала')+menuRow('data','export','Мои данные','HTML, JSON, CSV, схема и импорт')+menuRow('settings','sun','Настройки','Груз, леска, экран и вибрация')+menuRow('demo','play',demo?'Выйти из примера':'Попробовать на примере','Учебные точки отдельно от твоих')+'<div class="card"><div class="eyebrow">MARKER / MOBILE 2.0</div><p class="small">Сектор и журнал работают без сети. Для реальных снимков нужен интернет. Данные не синхронизируются в облако.</p></div>';
 document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const k=b.dataset.menu;if(k==='reel')openReel();else if(k==='position')openPosition();else if(k==='compass')openCompass();else if(k==='settings')openSettings();else if(k==='demo')toggleDemo();else openPage(k);});}
function renderJournal(){ $('pageTitle').textContent='Промеры · '+state.casts.length;const root=$('pageContent');if(!state.casts.length){root.innerHTML='<div class="empty">'+icon('sector')+'<h3>Пока чистый лист</h3><p>Начни промер на секторе. Сохрани направление, падение и ощущения на обратном пути.</p>'+btn('journalStart','К сектору')+'</div>';on('journalStart',closePage);return;}root.innerHTML='<p class="small" style="margin-bottom:18px">Метры — длина лески, не точная горизонтальная дальность.</p>'+state.casts.map((c,i)=>({c,i})).reverse().map(({c,i})=>'<article class="journal-card"><div class="journal-title"><div class="journal-number">'+(i+1)+'</div><div class="info"><strong>≈ '+fmt(c.distance,1)+' м <span style="font-weight:450;color:#788b7c">· '+degrees(c.angle)+'</span></strong><small>'+(c.fall===null?'Падение не замерено':fmt(c.fall,1)+' с падения')+' · '+(c.method==='reel'?'по оборотам':'оценка')+' · '+c.events.length+' отмет.</small></div>'+icon(c.status==='working'?'check':c.status==='candidate'?'target':'sector')+'</div><div class="sensory">'+(c.events.length?c.events.map(e=>'<span class="seg" title="'+C.TYPES[e.type].label+'" style="background:'+C.TYPES[e.type].color+'"></span>').join(''):'<span class="seg" style="background:#e2e9de"></span>')+'</div><div class="journal-actions"><span class="tag">'+(c.status==='working'?'Кормушка проверена':c.status==='candidate'?'Кандидат для ловли':'Наблюдение')+'</span><button data-record="'+esc(c.id)+'">Открыть</button><button data-repeat="'+esc(c.id)+'">Повторить</button></div></article>').join('');document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>openRecord(b.dataset.record));document.querySelectorAll('[data-repeat]').forEach(b=>b.onclick=()=>repeatCast(b.dataset.repeat));}
function repeatCast(id){if(state.draft){toast('Сначала сохрани текущий промер.');return;}const c=state.casts.find(c=>c.id===id);if(!c)return;const sameRef=c.referenceBearing===null||!state.settings.geoAligned||Math.abs(C.delta(c.referenceBearing,state.settings.bearing))<2;state.aim={angle:C.clamp(c.angle,-85,85),distance:C.clamp(c.distance,1,180)};ui.followHeading=false;save();closeSheet();closePage();setView('sector');renderDock();if(!sameRef)toast('Ориентир изменился. Старый относительный угол скопирован — проверь направление заново.');else toast('Направление и дистанция повторены. Время замерь новым забросом.');}
function openRecord(id){const c=state.casts.find(c=>c.id===id);if(!c)return;const i=state.casts.indexOf(c);ui.selected=id;showSheet('Заброс #'+(i+1),'<div class="readout"><span>'+degrees(c.angle)+' · '+(c.fall===null?'без времени':fmt(c.fall,1)+' с')+'</span><strong>≈ '+fmt(c.distance,1)+' м</strong></div><p>'+fmt(c.turns,1)+' об. × '+fmt(c.pickup*100,1)+' см · '+(c.pickupCalibrated?'выборка измерена':'выборка не откалибрована')+'. '+(c.method==='reel'?'Учтена полная подмотка.':'Дистанция оценочная.')+'</p>'+(c.events.length?'<div class="eyebrow">ОТ ДАЛЬНЕЙ ТОЧКИ К БЕРЕГУ</div><div class="profile-strip" style="overflow-x:auto">'+c.events.map(e=>'<button class="profile-event" data-event="'+esc(e.id)+'"><span class="event-tile" style="background:'+C.TYPES[e.type].color+'">'+C.TYPES[e.type].short+'</span><span>≈'+fmt(C.distanceAt(c,e.turns))+'м</span></button>').join('')+'</div><p class="small">Коснись отметки, чтобы исправить счётчик или добавить измеренную глубину.</p>':'')+field('recordDepth','Измеренная глубина в точке падения, м',c.depth,{placeholder:'Не измерял — оставить пустым'})+'<label class="field">Заметка<textarea id="recordNotes" maxlength="4000" rows="2">'+esc(c.notes)+'</textarea></label><label class="checkrow"><input id="recordCandidate" type="checkbox" '+(c.status!=='survey'?'checked':'')+'><span>Кандидат для ловли</span></label><details><summary class="subtle-action">Проверка кормушкой и исправление дистанции</summary><label class="checkrow"><input id="recordHeld" type="checkbox" '+(c.feederHeld?'checked':'')+'><span>Кормушка удерживается</span></label><label class="checkrow"><input id="recordClean" type="checkbox" '+(c.cleanRetrieve?'checked':'')+'><span>Выматывается без постоянных зацепов</span></label>'+field('recordDistance','Исправить дистанцию, м',Math.round(c.distance*10)/10,{help:'Изменение вручную переведёт дистанцию в режим оценки.'})+'</details><div class="stack">'+btn('saveRecord','Сохранить изменения')+btn('repeatRecord','Повторить направление','secondary')+btn('deleteRecord','Удалить заброс','danger-button')+'</div>',()=>{document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>openEvent(c.id,b.dataset.event));on('saveRecord',()=>{const depth=num('recordDepth'),distance=num('recordDistance');if(depth!==null&&(!Number.isFinite(depth)||depth<0||depth>100))return errorSheet('Нужна глубина от 0 до 100 м или пустое поле.');if(distance===null||!Number.isFinite(distance)||distance<=0||distance>500)return errorSheet('Дистанция должна быть больше 0 и не больше 500 м.');c.depth=depth;c.notes=$('recordNotes').value;c.feederHeld=$('recordHeld').checked;c.cleanRetrieve=$('recordClean').checked;c.status=c.feederHeld&&c.cleanRetrieve?'working':$('recordCandidate').checked?'candidate':'survey';if(Math.abs(c.distance-distance)>.051){c.distance=distance;c.estimatedDistance=distance;c.method='estimate';c.complete=false;}save();closeSheet();map.request();mapLabels();if(ui.page==='journal')renderJournal();toast('Изменения сохранены.');});on('repeatRecord',()=>repeatCast(c.id));on('deleteRecord',()=>confirmSheet('Удалить заброс #'+(i+1)+'?','Удалятся его время, отметки и заметка. Остальные записи не изменятся.','Удалить',()=>{state.casts=state.casts.filter(x=>x.id!==c.id);save();closeSheet();renderDock();if(ui.page==='journal')renderJournal();map.request();toast('Заброс удалён.','Вернуть',()=>{state.casts.splice(Math.min(i,state.casts.length),0,c);save();updateTop();map.request();if(ui.page==='journal')renderJournal();},6500);}));});}
function openEvent(castId,eventId){const c=state.casts.find(c=>c.id===castId),e=c?.events.find(e=>e.id===eventId);if(!e)return;showSheet(C.TYPES[e.type].label+' · отметка',field('eventTurns','Оборотов от начала протяжки',e.turns)+field('eventDepth','Измеренная глубина здесь, м',e.depth,{placeholder:'Не измерял — оставить пустым'})+'<p>Это отдельное наблюдение на следе груза. Ощущение «подъём» не задаёт высоту свала.</p><div class="stack">'+btn('saveEvent','Сохранить отметку')+btn('removeEvent','Удалить отметку','danger-button')+'</div>',()=>{on('saveEvent',()=>{const n=num('eventTurns'),depth=num('eventDepth');if(n===null||!Number.isFinite(n)||n<0||n>Math.max(c.turns,...c.events.map(e=>e.turns)))return errorSheet('Отметка должна находиться внутри записанной протяжки.');if(depth!==null&&(!Number.isFinite(depth)||depth<0||depth>100))return errorSheet('Проверь глубину.');e.turns=n;e.depth=depth;c.events.sort((a,b)=>a.turns-b.turns);save();map.request();mapLabels();openRecord(castId);});on('removeEvent',()=>{c.events=c.events.filter(x=>x.id!==eventId);save();map.request();openRecord(castId);});});}
function renderGuide(){ $('pageTitle').textContent='Как читать дно';$('pageContent').innerHTML='<div class="eyebrow">ШПАРГАЛКА У ВОДЫ</div><h1 style="margin-top:9px">Ощути дно.<br>Сохрани точку.</h1><p class="lead">Маркер хранит то, что ты почувствовал. Снимок помогает с ориентиром, а пригодность точки проверяет кормушка.</p><div class="card" style="padding:14px 10px"><svg viewBox="0 0 340 170" role="img" aria-label="Учебный разрез: берег слева, склон и чистая площадка; груз протягивается к берегу." style="width:100%;height:auto"><path d="M10 45H330V147H168L116 103 54 62H10Z" fill="#e0eee5"/><path d="M10 45H330" stroke="#8bab9d" fill="none"/><path d="M10 62H54L116 103 168 147H330" stroke="#456d57" stroke-width="3" fill="none"/><path d="M224 133H165l9-7m-9 7 9 7" fill="none" stroke="#b97830" stroke-width="2.5"/><circle cx="232" cy="138" r="6" fill="#18594a"/><path d="M20 39 230 137" stroke="#71967c" stroke-dasharray="4 4" fill="none"/><text x="15" y="28" fill="#4d705b" font-size="12">берег</text><text x="91" y="136" fill="#4d705b" font-size="11">свал</text><text x="259" y="133" fill="#4d705b" font-size="11">площадка</text><text x="169" y="164" fill="#718377" font-size="10">Учебный разрез, не дно Цыгылинки</text></svg></div>'+[
 ['Подготовь катушку','Отмерь, например, 10 м лески и посчитай полные обороты ручки при подмотке. Раздели длину на число оборотов. Введи результат в «Катушка». Паспортная выборка и полная шпуля могут отличаться от твоей снасти.'],
 ['Задай берег и нулевой ориентир','На снимке поставь место, где стоишь, и заметный объект напротив. Без сети работай в секторе: выбери тот же объект глазами. Компас — необязательная помощь, его нужно обнулить по этому ориентиру.'],
 ['Наметь первый заброс','Выбери на секторе направление и примерные метры. Сними поводок с крючком и поставь подходящий под снасть маркерный груз. Для повторяемости используй один вес груза, леску и манеру погружения.'],
 ['Нажми «вода», затем «дно»','Крупную область нажимай в момент касания воды, не в начале полёта. Второе касание — когда почувствовал дно. Телефон лучше положить устойчиво рядом. При уходе из вкладки замер помечается прерванным.'],
 ['Тяни удилищем, считай ручку','Медленно протягивай груз удилищем. Возвращая удилище, выбирай слабину. В приложении считай обороты ручки кнопками +1 или +5; можно удерживать кнопку. Число также можно ввести целиком касанием счётчика.'],
 ['Ощутил изменение — коснись типа','Ровно, стук, вязко, подъём, трава или упор. Отметка привяжется к текущему счётчику. Это наблюдение, а не доказанный состав дна. Не вырывай груз силой из неподвижного упора.'],
 ['Доведи счёт до берега','Когда выбрал весь путь, отметь «Вся леска выбрана до берега». Тогда начальная длина ≈ все обороты × выборка, а длина у отметки ≈ оставшиеся обороты × выборка. Если остановился раньше, приложение оставит начальную оценку.'],
 ['Повтори и проверь кормушкой','Перспективную площадку перепроверь тем же направлением и соседними проходами. Затем поставь кормушку: она должна держаться и нормально выматываться. Только после проверки отмечай точку рабочей.']
 ].map((x,i)=>'<div class="help-step"><div class="step-no">'+(i+1)+'</div><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></div>').join('')+'<div class="warning"><b>Почему метры примерные</b><br>Мы считаем выбранную леску, а не прямую дистанцию по дну. На результат влияют провис, течение, растяжение, положение удилища и наполненность шпули. Во время протяжки точки предварительные; после полной подмотки они пересчитываются.</div><div class="card"><h3>Что значит 3D</h3><p class="small">Пустой кружок — глубина неизвестна. Заполненная точка с вертикальной линией — глубина, которую ты ввёл после отдельного измерения. Ощущения и секунды не превращаются в глубину; между забросами поверхность не дорисовывается.</p></div><div class="card"><h3>Падение — для сравнения</h3><p class="small">Сравнивай секунды только при сопоставимых грузе, леске, течении и погружении. «Одна секунда — один метр» здесь не используется. «Подъём» обозначает ощущение при движении к берегу, а не измеренную высоту.</p></div><details class="card"><summary>Снимок, компас и офлайн</summary><p class="small">Снимок — официальное ортофото GUGiK, не гарантированно свежий спутниковый кадр. Его дата и детализация зависят от участка. Снимок не показывает подводный рельеф. При сбое слоя высокой детализации запрашивается стандартный слой.</p><p class="small">Сектор, журнал, таймер и экспорт работают без сети. HTTPS-версия с Service Worker может сохранить само приложение для повторного офлайн-открытия. Снимки в офлайн-пакет не входят. Компас, геолокация и удержание экрана зависят от браузера и разрешений.</p></details><details class="card"><summary>Технические источники</summary><p class="small source-link"><a target="_blank" rel="noopener" href="https://www.geoportal.gov.pl/pl/dane/ortofotomapa-orto/">GUGiK: ортофото и WMS</a><br><a target="_blank" rel="noopener" href="https://developer.apple.com/documentation/webkitjs/deviceorientationevent">Apple: ориентация и направление компаса</a><br><a target="_blank" rel="noopener" href="https://developer.mozilla.org/en-US/docs/Web/API/DeviceOrientationEvent/requestPermission_static">MDN: разрешение на датчик</a><br><a target="_blank" rel="noopener" href="https://developer.mozilla.org/en-US/docs/Web/API/Screen_Wake_Lock_API">MDN: удержание экрана</a></p></details>'+btn('guideDone','К сектору');on('guideDone',closePage);}
function openSettings(){showSheet('Настройки у воды',field('settingsTitle','Название сессии',state.title,{decimal:false,maxlength:80})+'<div class="row">'+field('settingsLead','Маркерный груз, г',state.settings.lead)+'<label class="field">Основная леска<select id="settingsLine"><option '+(state.settings.line==='Плетёнка'?'selected':'')+'>Плетёнка</option><option '+(state.settings.line==='Мононить'?'selected':'')+'>Мононить</option><option '+(!['Плетёнка','Мононить'].includes(state.settings.line)?'selected':'')+'>Не указано</option></select></label></div><label class="checkrow"><input id="settingsWake" type="checkbox" '+(state.settings.wake?'checked':'')+'><span>Не гасить экран во время промера<small>Если браузер разрешает. Это расходует батарею.</small></span></label><label class="checkrow"><input id="settingsHaptic" type="checkbox" '+(state.settings.haptic?'checked':'')+'><span>Вибрация на действиях<small>Только на поддерживаемых устройствах.</small></span></label><label class="field">Источник ортофото<select id="settingsImagery"><option value="HighResolution" '+(state.settings.imagery==='HighResolution'?'selected':'')+'>Высокое разрешение → стандартный резерв</option><option value="StandardResolution" '+(state.settings.imagery==='StandardResolution'?'selected':'')+'>Стандартное разрешение GUGiK</option></select></label>'+btn('saveSettings','Готово')+'<p>Новый вес груза и леска применяются к будущим промерам. Старые записи хранят свои параметры.</p>',()=>on('saveSettings',()=>{const lead=num('settingsLead');if(lead===null||!Number.isFinite(lead)||lead<1||lead>500)return errorSheet('Вес груза должен быть от 1 до 500 г. Соблюдай тест своей снасти.');state.title=$('settingsTitle').value.trim().slice(0,80)||'Моя рыбалка';state.settings.lead=lead;state.settings.line=$('settingsLine').value;state.settings.wake=$('settingsWake').checked;state.settings.haptic=$('settingsHaptic').checked;state.settings.imagery=$('settingsImagery').value;save();closeSheet();renderDock();map.request();if(state.settings.wake)acquireWake();else releaseWake();if(ui.page==='menu')renderPage('menu');}));}
function toggleDemo(){if(demo){state=actual;actual=null;demo=false;ui.phase=state.draft?.phase||'ready';}else{if(state.draft){toast('Сначала сохрани текущий промер.');return;}save();actual=state;state=C.sample();demo=true;ui.phase='ready';}disableSensors();ui.placeMode=null;ui.undo=[];closeSheet();closePage();ui.view='sector';renderDock();updateTop();map.request();}
function archiveCurrent(){if(demo)return;const key=KEY+':archive';let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(a))a=[];a.push(C.clone(state));if(a.length>20)throw Error('Архив заполнен (20 сессий). Сначала экспортируй данные.');localStorage.setItem(key,JSON.stringify(a));}catch(e){throw Error('Не получилось сохранить предыдущую сессию в архив. Сначала экспортируй её.');}}
function archives(){try{const a=JSON.parse(localStorage.getItem(KEY+':archive')||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function renderData(){ $('pageTitle').textContent='Мои данные';const a=archives();$('pageContent').innerHTML='<div class="card"><div class="eyebrow">'+(demo?'УЧЕБНЫЕ ДАННЫЕ':ui.saveOK?'СОХРАНЕНО В ЭТОМ БРАУЗЕРЕ':'НУЖЕН РУЧНОЙ ЭКСПОРТ')+'</div><h2 style="margin-top:7px">'+state.casts.length+' забросов</h2><p class="small">Автосохранение не равно облачной копии. Перед закрытием браузера сохрани HTML или JSON.</p></div><div class="stack">'+btn('exportHTML',icon('export')+' HTML с моими записями')+btn('exportJSON','JSON · резервная копия','secondary')+btn('exportCSV','CSV · таблица измерений','secondary')+btn('exportPNG','PNG · схема сектора','secondary')+btn('doImport',icon('import')+' Импорт HTML или JSON','secondary')+'</div><p class="small" style="margin:14px 0 22px;line-height:1.65">HTML-копия открывается отдельно и не требует сети для сектора. Импорт понимает и предыдущую версию Маркера. Снимки Geoportal в копию не встраиваются.</p>'+(rawInvalid?'<div class="warning">Есть повреждённая исходная сессия. Сначала выгрузи её без изменений.</div><div style="margin:12px 0">'+btn('exportDamaged','Выгрузить исходные данные','secondary')+'</div>':'')+'<div class="divider"></div>'+btn('newSession','Новая рыбалка','secondary')+'<p class="small" style="margin:10px 0 20px">Текущая сессия останется в локальном архиве.</p>'+(a.length?'<div class="eyebrow">АРХИВ ЭТОГО БРАУЗЕРА</div>'+a.map((s,i)=>'<button class="menu-row" data-archive="'+i+'"><span class="menu-icon">'+icon('journal')+'</span><span class="row-label"><strong>'+esc(s.title||'Сессия')+'</strong><span class="small">'+(s.casts?.length||0)+' забросов · '+esc((s.createdAt||'').slice(0,10))+'</span></span>'+icon('next')+'</button>').join(''):'');
 on('exportHTML',exportHTML);on('exportJSON',()=>download(JSON.stringify(state,null,2),'application/json','json'));on('exportCSV',exportCSV);on('exportPNG',exportPNG);on('doImport',()=>$('importFile').click());on('exportDamaged',()=>{download(rawInvalid,'application/json','damaged.json');});on('newSession',()=>{if(demo||state.draft){toast('Выйди из примера или сохрани текущий промер.');return;}confirmSheet('Начать новую рыбалку?','Эта сессия будет сохранена в архиве браузера. Для надёжной копии сначала экспортируй HTML или JSON.','Новая сессия',()=>{try{archiveCurrent();const title=state.title;const settings=C.clone(state.settings);state=C.create();state.title=title;state.settings={...settings,bank:null,reference:null,geoAligned:false};rawInvalid=null;ui.phase='ready';save();closeSheet();closePage();setView('sector');renderDock();toast('Новая сессия. Предыдущая — в «Мои данные».');}catch(e){errorSheet(e.message);}});});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{if(state.draft||demo){toast('Сначала заверши текущий промер или выйди из примера.');return;}const index=Number(b.dataset.archive),arr=archives();try{const restored=C.validate(arr[index]);arr[index]=C.clone(state);localStorage.setItem(KEY+':archive',JSON.stringify(arr));state=restored;ui.phase=state.draft?.phase||'ready';if(ui.phase==='falling'){ui.phase='interrupted';state.draft.phase='interrupted';}save();renderData();renderDock();map.request();toast('Сессия восстановлена. Текущая перемещена в архив.');}catch(e){toast('Не удалось восстановить сессию: '+e.message);}});
}
function stem(){return 'marker-'+new Date().toISOString().slice(0,10)+(demo?'-demo':'');}
function download(data,type,extension){const blob=data instanceof Blob?data:new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=stem()+'.'+extension;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Файл подготовлен. Сохрани его через браузер.');}
function exportHTML(){try{const doc=new DOMParser().parseFromString(SOURCE,'text/html');doc.documentElement.dataset.storeId='copy-'+C.uid();delete doc.documentElement.dataset.pwa;doc.querySelectorAll('link[rel=manifest],link[rel=apple-touch-icon]').forEach(n=>n.remove());doc.getElementById('embedded-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');download('<!doctype html>\n'+doc.documentElement.outerHTML,'text/html;charset=utf-8','html');}catch(e){toast('Не удалось собрать копию: '+e.message);}}
function exportCSV(){const cell=x=>{let s=x===null||x===undefined?'':String(x);if(typeof x==='string'&&/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['cast','record_type','angle_deg','approx_line_m','fall_seconds','turns','pickup_cm','pickup_measured','distance_method','feeling','remaining_line_m','measured_depth_m','approx_lat','approx_lng','bearing_deg','notes']];state.casts.forEach((c,i)=>{const add=(e)=>{const distance=e?C.distanceAt(c,e.turns):c.distance,p=c.origin&&c.bearing!==null?C.destination(c.origin,c.bearing,distance):null;rows.push([i+1,e?'event':'cast',c.angle,c.distance,c.fall,e?e.turns:c.turns,c.pickup*100,c.pickupCalibrated,c.method,e?C.TYPES[e.type].label:'',distance,e?e.depth:c.depth,p?.lat,p?.lng,c.bearing,e?'':c.notes]);};add(null);c.events.forEach(add);});download('\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8','csv');}
function exportPNG(){const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1200;const ctx=canvas.getContext('2d'),s=C.clone(state);s.draft=null;const extent=Math.max(30,...s.casts.map(c=>c.distance));s.settings.range=Math.max(extent*1.6,60);const fake=Object.create(FieldMap.prototype);Object.assign(fake,{canvas,ctx,width:1000,height:1200,dpr:1,hits:[],get:()=>({state:s,ui:{phase:'export',dockHeight:170,safeTop:50}})});fake.drawSector(s,{phase:'export'});ctx.fillStyle='#f5f9ef';ctx.fillRect(0,0,1000,145);ctx.fillStyle='#1c5345';ctx.font='bold 40px sans-serif';ctx.fillText('маркер / '+s.title,45,66);ctx.font='20px sans-serif';ctx.fillStyle='#5e7c6a';ctx.fillText(s.casts.length+' забросов · относительный сектор · '+new Date().toLocaleDateString('ru-RU'),45,108);ctx.fillStyle='#f5f9ef';ctx.fillRect(0,1040,1000,160);Object.entries(C.TYPES).forEach(([k,t],i)=>{const x=45+(i%3)*310,y=1075+Math.floor(i/3)*35;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=t.color;ctx.fill();ctx.fillStyle='#526f5d';ctx.font='18px sans-serif';ctx.fillText(t.label,x+15,y+6);});ctx.fillStyle='#6a7e70';ctx.font='17px sans-serif';ctx.fillText('Метры — приблизительная длина лески. Глубины не восстановлены.',45,1165);canvas.toBlob(blob=>{if(blob)download(blob,'image/png','png');else toast('Не удалось подготовить изображение.');},'image/png');}
async function importFile(file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('Максимальный размер импорта — 5 МБ.');let raw=await file.text();if(/<!doctype|<html/i.test(raw.slice(0,500))){const doc=new DOMParser().parseFromString(raw,'text/html'),node=doc.getElementById('embedded-state');if(!node||node.textContent.trim()==='null')throw Error('В HTML нет встроенных записей. Выгрузи HTML с данными из прежней версии.');raw=node.textContent;}const incoming=C.parse(raw);showSheet('Импортировать сессию?','<p><b>'+esc(incoming.title)+'</b><br>'+incoming.casts.length+' забросов. Текущая сессия будет сохранена в локальном архиве.</p>'+btn('confirmImport','Импортировать'),()=>on('confirmImport',()=>{try{if(demo){state=actual;actual=null;demo=false;}if(rawInvalid){localStorage.setItem(KEY+':damaged-backup',rawInvalid);rawInvalid=null;}archiveCurrent();const previous=state;state=incoming;if(incoming.example){actual=previous;demo=true;}if(state.draft?.phase==='falling'){state.draft.phase='interrupted';state.draft.fall=null;state.draft.fallInterrupted=true;}ui.phase=state.draft?.phase||'ready';ui.placeMode=null;ui.undo=[];disableSensors();save();closeSheet();closePage();setView('sector');renderDock();toast('Сессия импортирована. Предыдущая сохранена в архиве.');}catch(e){errorSheet(e.message);}}));}catch(e){toast('Импорт не выполнен: '+e.message,null,null,6500);}finally{$('importFile').value='';}}

map=new FieldMap($('mapCanvas'),()=>({state,ui}),{onAim:(angle,distance)=>{state.aim={angle:Math.round(angle*10)/10,distance:Math.round(distance*10)/10};ui.followHeading=false;updateAim();},onRange:range=>{state.settings.range=range;map?.request();scheduleSave();},onSelect:id=>{if(state.casts.some(c=>c.id===id))openRecord(id);},onNeedPosition:()=>toast('Сначала поставь берег и ориентир.','Привязать',openPosition),onGestureEnd:save,onMapStatus:status=>{ui.mapStatus=status;mapLabels();}});
on('menuBtn',()=>openPage('menu'));on('journalBtn',()=>openPage('journal'));on('pageBack',closePage);on('sheetClose',closeSheet);on('exitDemo',toggleDemo);on('compassBtn',openCompass);on('locateBtn',openPosition);on('zoomIn',()=>map.zoom(1));on('zoomOut',()=>map.zoom(-1));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));on('importFile',e=>importFile(e.target.files[0]),'change');
on('modal',e=>{if(e.target===$('modal'))closeSheet();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)closeSheet();else if(!$('page').hidden)closePage();}if(e.key==='Tab'&&!$('modal').hidden){const nodes=[...$('sheet').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,a[href],summary')].filter(el=>el.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});

else if(state.draft)setTimeout(()=>toast('Незавершённый промер восстановлен. Отметки и обороты на месте.',null,null,5500),500);

if(document.documentElement.dataset.pwa==='true'&&'serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
